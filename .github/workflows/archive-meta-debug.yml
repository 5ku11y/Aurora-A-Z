name: Archive metadata page diagnostic

on:
  push:
    branches:
      - spelunkr360-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect exact Toonami Archive file metadata and MP4 layout
        shell: bash
        run: |
          set -euo pipefail
          ID='ocwoc-081-toonami-full-cycle-marathon-cn-2000_202505'
          WANT='OCWOC 081 - Toonami Full Cycle Marathon (CN, 2000).ia.mp4'
          URL='https://archive.org/download/ocwoc-081-toonami-full-cycle-marathon-cn-2000_202505/OCWOC%20081%20-%20Toonami%20Full%20Cycle%20Marathon%20(CN%2C%202000).ia.mp4'
          curl -fsSL "https://archive.org/metadata/${ID}/files?start=0&count=24" -o /tmp/page.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/page.json'))
          wanted='OCWOC 081 - Toonami Full Cycle Marathon (CN, 2000).ia.mp4'
          rows=obj.get('result',[])
          row=next(r for r in rows if r.get('name')==wanted)
          print('FOUND_ROW',json.dumps(row,separators=(',',':')))
          print('SIZE',row.get('size'))
          PY

          SIZE=3755491138
          curl -fsSL -r 0-1048575 "$URL" -o /tmp/head.bin
          START=$((SIZE-1048576))
          curl -fsSL -r "${START}-$((SIZE-1))" "$URL" -o /tmp/tail.bin

          python3 - <<'PY'
          import struct
          total=3755491138
          head=open('/tmp/head.bin','rb').read()
          tail=open('/tmp/tail.bin','rb').read()
          print('HEAD_BYTES',len(head),'TAIL_BYTES',len(tail))

          def atom_at(buf, off, base=0):
              if off+8>len(buf): return None
              size=struct.unpack('>I',buf[off:off+4])[0]
              typ=buf[off+4:off+8].decode('latin1')
              header=8
              if size==1:
                  if off+16>len(buf): return None
                  size=struct.unpack('>Q',buf[off+8:off+16])[0]
                  header=16
              elif size==0:
                  size=total-(base+off)
              return size,typ,header

          off=0
          print('TOP_LEVEL_FROM_START')
          for _ in range(12):
              a=atom_at(head,off,0)
              if not a: break
              size,typ,h=a
              print(base:=off,typ,size)
              if size<8: break
              off += size
              if off>=len(head): break

          tail_base=total-len(tail)
          for name,buf,base in [('HEAD',head,0),('TAIL',tail,tail_base)]:
              for typ in (b'moov',b'mdat',b'ftyp'):
                  pos=0
                  while True:
                      i=buf.find(typ,pos)
                      if i<0: break
                      if i>=4:
                          small=struct.unpack('>I',buf[i-4:i])[0]
                          ext=None
                          if small==1 and i+12<=len(buf):
                              ext=struct.unpack('>Q',buf[i+4:i+12])[0]
                          print(name,'ATOM_MARK',typ.decode(), 'TYPE_AT',base+i,'SIZE32',small,'EXT',ext)
                      pos=i+4
          PY
