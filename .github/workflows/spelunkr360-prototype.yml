name: Spelunkr360 V4 corrected-present probe

on:
  push:
    branches:
      - spelunkr360-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      XSDK_COMMIT: 8c58c7a3fb37bb261c5a11a8a1f4fa8a8bfd0d28
      XSDK_ROOT: /home/runner/work/_temp/xsdk-source
      XSDK_TOOLCHAIN: /home/runner/work/_temp/xsdk-gcc
      XSDK_TOOLCHAIN_CACHE: xsdk-gcc15-v1-8c58c7a3fb37bb261c5a11a8a1f4fa8a8bfd0d28

    steps:
      - name: Check out Spelunkr branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install xsdk host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 cmake ninja-build git

      - name: Fetch pinned xsdk
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/xenosworks/xsdk.git "${XSDK_ROOT}"
          git -C "${XSDK_ROOT}" checkout --detach "${XSDK_COMMIT}"
          test "$(git -C "${XSDK_ROOT}" rev-parse HEAD)" = "${XSDK_COMMIT}"

      - name: Restore xsdk GCC toolchain
        id: xsdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.XSDK_TOOLCHAIN }}
          key: ${{ env.XSDK_TOOLCHAIN_CACHE }}

      - name: Build xsdk GCC toolchain on cache miss
        if: steps.xsdk-cache.outputs.cache-hit != 'true'
        env:
          PREFIX: ${{ env.XSDK_TOOLCHAIN }}
          WORK: /home/runner/work/_temp/xsdk-gcc-work
          JOBS: 4
        run: |
          cd "${XSDK_ROOT}"
          bash tools/toolchain/build.sh

      - name: Save xsdk GCC toolchain after cache miss
        if: steps.xsdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.XSDK_TOOLCHAIN }}
          key: ${{ env.XSDK_TOOLCHAIN_CACHE }}

      - name: Verify xsdk compiler
        run: |
          test -x "${XSDK_TOOLCHAIN}/bin/powerpc-xsdk-elf-gcc"
          "${XSDK_TOOLCHAIN}/bin/powerpc-xsdk-elf-gcc" --version

      - name: Build xsdk runtime
        run: |
          make -C "${XSDK_ROOT}" -j4 TOOLCHAIN="${XSDK_TOOLCHAIN}/bin/powerpc-xsdk-elf-"
          test -f "${XSDK_ROOT}/build/libxsdk.a"

      - name: Build Spelunkr360 V4
        run: |
          cmake -S native/spelunkr360_v4 -B build/spelunkr360_v4 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${XSDK_ROOT}/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="${XSDK_TOOLCHAIN}"
          cmake --build build/spelunkr360_v4
          sha256sum build/spelunkr360_v4/Spelunkr360V4.xex > build/spelunkr360_v4/Spelunkr360V4.xex.sha256

      - name: Validate Spelunkr360 V4 XEX and dashboard title resource
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          TITLE_ID = 0x53503601
          EXECUTION_ID_HEADER = 0x00040006
          RESOURCE_INFO_HEADER = 0x000002FF
          p = Path('build/spelunkr360_v4/Spelunkr360V4.xex')
          data = p.read_bytes()

          if data[:4] != b'XEX2':
              raise SystemExit('Spelunkr360 V4 is not XEX2')

          count = struct.unpack_from('>I', data, 0x14)[0]
          headers = {}
          for index in range(count):
              header_id, value = struct.unpack_from('>II', data, 0x18 + index * 8)
              headers[header_id] = value

          execution_offset = headers.get(EXECUTION_ID_HEADER)
          if execution_offset is None:
              raise SystemExit('Spelunkr360 V4 has no Execution ID')
          title_id = struct.unpack_from('>I', data, execution_offset + 12)[0]
          if title_id != TITLE_ID:
              raise SystemExit(f'wrong TitleID: {title_id:08X}')

          resource_offset = headers.get(RESOURCE_INFO_HEADER)
          if resource_offset is None:
              raise SystemExit('Spelunkr360 V4 has no XEX resource-info header')
          resource_header_size = struct.unpack_from('>I', data, resource_offset)[0]
          resource_name = data[resource_offset + 4:resource_offset + 12]
          resource_address, resource_size = struct.unpack_from('>II', data, resource_offset + 12)
          if resource_header_size < 20:
              raise SystemExit(f'bad resource header size: {resource_header_size}')
          if resource_name != b'53503601':
              raise SystemExit(f'wrong dashboard resource name: {resource_name!r}')
          if resource_size == 0:
              raise SystemExit('dashboard title resource has zero size')

          for marker in (b'XDBF', b'Spelunkr360', b'SPELUNKR360 V4', b'CH 53 - TOONERTIA', b'LIVE PRESENT: A', b'LIVE PRESENT: B'):
              if marker not in data:
                  raise SystemExit(f'missing marker {marker!r}')

          print(
              f'validated {p} ({p.stat().st_size} bytes), '
              f'TitleID={title_id:08X}, resource={resource_name.decode()}, '
              f'resource_addr=0x{resource_address:08X}, resource_size={resource_size}'
          )
          PY
          sha256sum --check build/spelunkr360_v4/Spelunkr360V4.xex.sha256

      - name: Upload Spelunkr360 V4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Spelunkr360-V4-${{ github.sha }}
          path: |
            build/spelunkr360_v4/Spelunkr360V4.xex
            build/spelunkr360_v4/Spelunkr360V4.xex.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
