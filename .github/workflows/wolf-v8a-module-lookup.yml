name: Wolf V8A bad import thunk trace probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Wolf hardware diagnostic: report the first live import thunk that differs
# from the authoritative XAM/xboxkrnl resolver target. No gate is bypassed.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENXECHAIN_ROOT: /home/runner/work/_temp/openxechain-prefix
      OPENXECHAIN_CACHE_KEY: openxechain-linux-x64-v2-eed1fa65bf9577fd31625764b320a90182ea9ade
      OPENXECHAIN_SYNTHXEX_COMMIT: 48d1453a55468aa2f8a211db0b20edd594ef5be3
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Apply Wolf V8A module lookup patch
        run: |
          git apply --check scripts/wolf-v8a-module-lookup.patch
          git apply scripts/wolf-v8a-module-lookup.patch
          git diff --check

      - name: Instrument bootstrap and bad import thunk diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path("native/src/netdbg_bootstrap.c")
          text = bootstrap.read_text()

          replacements = [
              (
                  "#include <auroraaz/hook_runtime.h>\n"
                  "#include <auroraaz/rev1655_runtime.h>",
                  "#include <auroraaz/hook_runtime.h>\n"
                  "#include <auroraaz/rev1655_hook_gate.h>\n"
                  "#include <auroraaz/rev1655_runtime.h>"
              ),
              (
                  "#define AZ_M2A_MARKER_WORKER_ENTERED 1u\n"
                  "#define AZ_M2A_MARKER_RUNTIME_RETURNED 2u\n"
                  "#define AZ_M2A_RESULT_NOT_ATTEMPTED 0xFFFFFFFFu",
                  "#define AZ_M2A_MARKER_BOOTSTRAP_ENTERED 0u\n"
                  "#define AZ_M2A_MARKER_WORKER_ENTERED 1u\n"
                  "#define AZ_M2A_MARKER_RUNTIME_RETURNED 2u\n"
                  "#define AZ_M2A_MARKER_PIN_RETURNED 3u\n"
                  "#define AZ_M2A_MARKER_THREAD_CREATE_RETURNED 4u\n"
                  "#define AZ_M2A_RESULT_NOT_ATTEMPTED 0xFFFFFFFFu"
              ),
              (
                  "            __ATOMIC_ACQUIRE)) {\n"
                  "        return 0u;\n"
                  "    }\n\n"
                  "    /* Close the only unload window",
                  "            __ATOMIC_ACQUIRE)) {\n"
                  "        return 0u;\n"
                  "    }\n\n"
                  "    write_m2a_marker(\n"
                  "        AZ_M2A_MARKER_BOOTSTRAP_ENTERED,\n"
                  "        AZ_M2A_RESULT_NOT_ATTEMPTED);\n\n"
                  "    /* Close the only unload window"
              ),
              (
                  "    pin_result = az_rev1655_runtime_pin_module(\n"
                  "        (uint32_t)(uintptr_t)&AuroraAZNetDbgWrite);\n"
                  "    if (pin_result != AZ_REV1655_RUNTIME_OK) {",
                  "    pin_result = az_rev1655_runtime_pin_module(\n"
                  "        (uint32_t)(uintptr_t)&AuroraAZNetDbgWrite);\n"
                  "    write_m2a_marker(\n"
                  "        AZ_M2A_MARKER_PIN_RETURNED,\n"
                  "        (uint32_t)pin_result);\n"
                  "    if (pin_result != AZ_REV1655_RUNTIME_OK) {"
              ),
              (
                  "    create_result = az_rev1655_thread_create(\n"
                  "        (void *)(uintptr_t)&bootstrap_rev1655_runtime,\n"
                  "        NULL,\n"
                  "        &thread);\n"
                  "    if (create_result ==",
                  "    create_result = az_rev1655_thread_create(\n"
                  "        (void *)(uintptr_t)&bootstrap_rev1655_runtime,\n"
                  "        NULL,\n"
                  "        &thread);\n"
                  "    write_m2a_marker(\n"
                  "        AZ_M2A_MARKER_THREAD_CREATE_RETURNED,\n"
                  "        (uint32_t)create_result);\n"
                  "    if (create_result =="
              ),
              (
                  "        3u,\n        (uint32_t)sizeof(AzM2aMarker),",
                  "        5u,\n        (uint32_t)sizeof(AzM2aMarker),"
              ),
              (
                  "        diagnostics.embedded_base,\n"
                  "        diagnostics.validation_failures,\n"
                  "        diagnostics.protection_before,\n"
                  "        diagnostics.protection_after,\n"
                  "        diagnostics.target_address,\n"
                  "        diagnostics.target_protection_before,\n"
                  "        diagnostics.target_protection_after",
                  "        az_rev1655_hook_gate_bad_import_index(),\n"
                  "        az_rev1655_hook_gate_bad_import_library(),\n"
                  "        az_rev1655_hook_gate_bad_import_ordinal(),\n"
                  "        az_rev1655_hook_gate_bad_import_live_target(),\n"
                  "        az_rev1655_hook_gate_bad_import_expected_target(),\n"
                  "        az_rev1655_hook_gate_bad_import_word0(),\n"
                  "        az_rev1655_hook_gate_bad_import_word1()"
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"bootstrap instrumentation anchor missing: {old[:80]!r}")
              text = text.replace(old, new, 1)
          bootstrap.write_text(text)

          header = Path("native/include/auroraaz/rev1655_hook_gate.h")
          text = header.read_text()
          old = (
              "const char *az_rev1655_hook_gate_result_name(\n"
              "    AzRev1655HookGateResult result);"
          )
          new = (
              "uint32_t az_rev1655_hook_gate_bad_import_index(void);\n"
              "uint32_t az_rev1655_hook_gate_bad_import_library(void);\n"
              "uint32_t az_rev1655_hook_gate_bad_import_ordinal(void);\n"
              "uint32_t az_rev1655_hook_gate_bad_import_live_target(void);\n"
              "uint32_t az_rev1655_hook_gate_bad_import_expected_target(void);\n"
              "uint32_t az_rev1655_hook_gate_bad_import_word0(void);\n"
              "uint32_t az_rev1655_hook_gate_bad_import_word1(void);\n\n"
              "const char *az_rev1655_hook_gate_result_name(\n"
              "    AzRev1655HookGateResult result);"
          )
          if old not in text:
              raise SystemExit("hook-gate header diagnostic anchor missing")
          header.write_text(text.replace(old, new, 1))

          gate = Path("native/src/rev1655_hook_gate.c")
          text = gate.read_text()
          replacements = [
              (
                  "static struct AzRev1655HookPermit g_permit;",
                  "static struct AzRev1655HookPermit g_permit;\n"
                  "static uint32_t g_bad_import_index = UINT32_MAX;\n"
                  "static uint32_t g_bad_import_library = UINT32_MAX;\n"
                  "static uint32_t g_bad_import_ordinal = UINT32_MAX;\n"
                  "static uint32_t g_bad_import_live_target = 0u;\n"
                  "static uint32_t g_bad_import_expected_target = 0u;\n"
                  "static uint32_t g_bad_import_word0 = 0u;\n"
                  "static uint32_t g_bad_import_word1 = 0u;"
              ),
              (
                  "    revoke_permit();\n"
                  "    if (out_permit != NULL) {",
                  "    revoke_permit();\n"
                  "    g_bad_import_index = UINT32_MAX;\n"
                  "    g_bad_import_library = UINT32_MAX;\n"
                  "    g_bad_import_ordinal = UINT32_MAX;\n"
                  "    g_bad_import_live_target = 0u;\n"
                  "    g_bad_import_expected_target = 0u;\n"
                  "    g_bad_import_word0 = 0u;\n"
                  "    g_bad_import_word1 = 0u;\n"
                  "    if (out_permit != NULL) {"
              ),
              (
                  "        if (!thunk_matches_target(thunk, expected_target)) {\n"
                  "            return AZ_REV1655_HOOK_GATE_BAD_IMPORT_THUNK;\n"
                  "        }",
                  "        if (!thunk_matches_target(thunk, expected_target)) {\n"
                  "            const uint32_t word0 = read_u32_be(thunk);\n"
                  "            const uint32_t word1 = read_u32_be(thunk + 4u);\n"
                  "            const uint32_t low = word1 & 0xFFFFu;\n"
                  "            uint32_t high = (word0 & 0xFFFFu) << 16u;\n\n"
                  "            if ((low & 0x8000u) != 0u) {\n"
                  "                high -= 0x10000u;\n"
                  "            }\n"
                  "            g_bad_import_index = (uint32_t)thunk_index;\n"
                  "            g_bad_import_library = (uint32_t)library;\n"
                  "            g_bad_import_ordinal = (uint32_t)ordinal;\n"
                  "            g_bad_import_expected_target = expected_target;\n"
                  "            g_bad_import_word0 = word0;\n"
                  "            g_bad_import_word1 = word1;\n"
                  "            if ((word0 & 0xFFFF0000u) == 0x3D600000u &&\n"
                  "                (word1 & 0xFFFF0000u) == 0x396B0000u &&\n"
                  "                read_u32_be(thunk + 8u) == 0x7D6903A6u &&\n"
                  "                read_u32_be(thunk + 12u) == 0x4E800420u) {\n"
                  "                g_bad_import_live_target = high + low;\n"
                  "            }\n"
                  "            return AZ_REV1655_HOOK_GATE_BAD_IMPORT_THUNK;\n"
                  "        }"
              ),
              (
                  "const char *az_rev1655_hook_gate_result_name(\n"
                  "    AzRev1655HookGateResult result)",
                  "uint32_t az_rev1655_hook_gate_bad_import_index(void)\n"
                  "{\n"
                  "    return g_bad_import_index;\n"
                  "}\n\n"
                  "uint32_t az_rev1655_hook_gate_bad_import_library(void)\n"
                  "{\n"
                  "    return g_bad_import_library;\n"
                  "}\n\n"
                  "uint32_t az_rev1655_hook_gate_bad_import_ordinal(void)\n"
                  "{\n"
                  "    return g_bad_import_ordinal;\n"
                  "}\n\n"
                  "uint32_t az_rev1655_hook_gate_bad_import_live_target(void)\n"
                  "{\n"
                  "    return g_bad_import_live_target;\n"
                  "}\n\n"
                  "uint32_t az_rev1655_hook_gate_bad_import_expected_target(void)\n"
                  "{\n"
                  "    return g_bad_import_expected_target;\n"
                  "}\n\n"
                  "uint32_t az_rev1655_hook_gate_bad_import_word0(void)\n"
                  "{\n"
                  "    return g_bad_import_word0;\n"
                  "}\n\n"
                  "uint32_t az_rev1655_hook_gate_bad_import_word1(void)\n"
                  "{\n"
                  "    return g_bad_import_word1;\n"
                  "}\n\n"
                  "const char *az_rev1655_hook_gate_result_name(\n"
                  "    AzRev1655HookGateResult result)"
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"hook-gate instrumentation anchor missing: {old[:80]!r}")
              text = text.replace(old, new, 1)
          gate.write_text(text)
          PY
          git diff --check

      - name: Restore pinned OpenXeChain toolchain
        id: openxechain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.OPENXECHAIN_ROOT }}
          key: ${{ env.OPENXECHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Verify cached OpenXeChain tools
        run: |
          test -x "${OPENXECHAIN_ROOT}/bin/clang"
          test -x "${OPENXECHAIN_ROOT}/bin/lld-link"
          test -x "${OPENXECHAIN_ROOT}/bin/synthxex"
          "${OPENXECHAIN_ROOT}/bin/clang" --version

      - name: Build patched SynthXEX
        env:
          SYNTHXEX_SOURCE_DIR: /home/runner/work/_temp/wolf-v8a-synthxex-source
          SYNTHXEX_BUILD_DIR: /home/runner/work/_temp/wolf-v8a-synthxex-build
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/OpenXeChain/SynthXEX.git \
            "${SYNTHXEX_SOURCE_DIR}"
          git -C "${SYNTHXEX_SOURCE_DIR}" checkout --detach \
            "${OPENXECHAIN_SYNTHXEX_COMMIT}"
          test "$(git -C "${SYNTHXEX_SOURCE_DIR}" rev-parse HEAD)" = \
            "${OPENXECHAIN_SYNTHXEX_COMMIT}"

          patch_file="${GITHUB_WORKSPACE}/scripts/openxechain-synthxex-image-base.patch"
          git -C "${SYNTHXEX_SOURCE_DIR}" apply --check "${patch_file}"
          git -C "${SYNTHXEX_SOURCE_DIR}" apply "${patch_file}"
          git -C "${SYNTHXEX_SOURCE_DIR}" diff --check

          cmake -S "${SYNTHXEX_SOURCE_DIR}" -B "${SYNTHXEX_BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${OPENXECHAIN_ROOT}"
          cmake --build "${SYNTHXEX_BUILD_DIR}" --parallel 2
          cmake --install "${SYNTHXEX_BUILD_DIR}"
          "${OPENXECHAIN_ROOT}/bin/synthxex" --version

      - name: Build Wolf V8A runtime
        run: bash scripts/build-openxechain.sh

      - name: Validate Wolf V8A runtime
        run: |
          output_dir="${GITHUB_WORKSPACE}/build/native-xbox360"
          test -s "${output_dir}/AuroraAZ.xex"
          test -s "${output_dir}/AuroraAZ.xex.sha256"
          python3 - "${output_dir}/AuroraAZ.xex" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          if p.read_bytes()[:4] != b"XEX2":
              raise SystemExit("runtime is not XEX2")
          print(f"validated XEX2: {p} ({p.stat().st_size} bytes)")
          PY
          (cd "${output_dir}" && sha256sum --check AuroraAZ.xex.sha256)

      - name: Stage NetDbgDll probe
        run: |
          mkdir -p build/wolf-v8a-bad-import-trace
          cp build/native-xbox360/AuroraAZ.xex build/wolf-v8a-bad-import-trace/NetDbgDll.xex
          (cd build/wolf-v8a-bad-import-trace && sha256sum NetDbgDll.xex > NetDbgDll.xex.sha256)

      - name: Upload Wolf V8A bad import thunk trace probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wolf-V8A-bad-import-trace-${{ github.sha }}
          path: build/wolf-v8a-bad-import-trace/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
