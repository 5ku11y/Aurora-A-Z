name: Wolf V8A bootstrap trace probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENXECHAIN_ROOT: /home/runner/work/_temp/openxechain-prefix
      OPENXECHAIN_CACHE_KEY: openxechain-linux-x64-v2-eed1fa65bf9577fd31625764b320a90182ea9ade
      OPENXECHAIN_SYNTHXEX_COMMIT: 48d1453a55468aa2f8a211db0b20edd594ef5be3
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Apply Wolf V8A module lookup patch
        run: |
          git apply --check scripts/wolf-v8a-module-lookup.patch
          git apply scripts/wolf-v8a-module-lookup.patch
          git diff --check

      - name: Instrument bootstrap failure marker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/src/netdbg_bootstrap.c")
          text = path.read_text()

          replacements = [
              (
                  "#define AZ_M2A_MARKER_WORKER_ENTERED 1u\n"
                  "#define AZ_M2A_MARKER_RUNTIME_RETURNED 2u\n"
                  "#define AZ_M2A_RESULT_NOT_ATTEMPTED 0xFFFFFFFFu",
                  "#define AZ_M2A_MARKER_BOOTSTRAP_ENTERED 0u\n"
                  "#define AZ_M2A_MARKER_WORKER_ENTERED 1u\n"
                  "#define AZ_M2A_MARKER_RUNTIME_RETURNED 2u\n"
                  "#define AZ_M2A_MARKER_PIN_RETURNED 3u\n"
                  "#define AZ_M2A_MARKER_THREAD_CREATE_RETURNED 4u\n"
                  "#define AZ_M2A_RESULT_NOT_ATTEMPTED 0xFFFFFFFFu"
              ),
              (
                  "            __ATOMIC_ACQUIRE)) {\n"
                  "        return 0u;\n"
                  "    }\n\n"
                  "    /* Close the only unload window",
                  "            __ATOMIC_ACQUIRE)) {\n"
                  "        return 0u;\n"
                  "    }\n\n"
                  "    write_m2a_marker(\n"
                  "        AZ_M2A_MARKER_BOOTSTRAP_ENTERED,\n"
                  "        AZ_M2A_RESULT_NOT_ATTEMPTED);\n\n"
                  "    /* Close the only unload window"
              ),
              (
                  "    pin_result = az_rev1655_runtime_pin_module(\n"
                  "        (uint32_t)(uintptr_t)&AuroraAZNetDbgWrite);\n"
                  "    if (pin_result != AZ_REV1655_RUNTIME_OK) {",
                  "    pin_result = az_rev1655_runtime_pin_module(\n"
                  "        (uint32_t)(uintptr_t)&AuroraAZNetDbgWrite);\n"
                  "    write_m2a_marker(\n"
                  "        AZ_M2A_MARKER_PIN_RETURNED,\n"
                  "        (uint32_t)pin_result);\n"
                  "    if (pin_result != AZ_REV1655_RUNTIME_OK) {"
              ),
              (
                  "    create_result = az_rev1655_thread_create(\n"
                  "        (void *)(uintptr_t)&bootstrap_rev1655_runtime,\n"
                  "        NULL,\n"
                  "        &thread);\n"
                  "    if (create_result ==",
                  "    create_result = az_rev1655_thread_create(\n"
                  "        (void *)(uintptr_t)&bootstrap_rev1655_runtime,\n"
                  "        NULL,\n"
                  "        &thread);\n"
                  "    write_m2a_marker(\n"
                  "        AZ_M2A_MARKER_THREAD_CREATE_RETURNED,\n"
                  "        (uint32_t)create_result);\n"
                  "    if (create_result =="
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"bootstrap instrumentation anchor missing: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check

      - name: Restore pinned OpenXeChain toolchain
        id: openxechain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.OPENXECHAIN_ROOT }}
          key: ${{ env.OPENXECHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Verify cached OpenXeChain tools
        run: |
          test -x "${OPENXECHAIN_ROOT}/bin/clang"
          test -x "${OPENXECHAIN_ROOT}/bin/lld-link"
          test -x "${OPENXECHAIN_ROOT}/bin/synthxex"
          "${OPENXECHAIN_ROOT}/bin/clang" --version

      - name: Build patched SynthXEX
        env:
          SYNTHXEX_SOURCE_DIR: /home/runner/work/_temp/wolf-v8a-synthxex-source
          SYNTHXEX_BUILD_DIR: /home/runner/work/_temp/wolf-v8a-synthxex-build
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/OpenXeChain/SynthXEX.git \
            "${SYNTHXEX_SOURCE_DIR}"
          git -C "${SYNTHXEX_SOURCE_DIR}" checkout --detach \
            "${OPENXECHAIN_SYNTHXEX_COMMIT}"
          test "$(git -C "${SYNTHXEX_SOURCE_DIR}" rev-parse HEAD)" = \
            "${OPENXECHAIN_SYNTHXEX_COMMIT}"

          patch_file="${GITHUB_WORKSPACE}/scripts/openxechain-synthxex-image-base.patch"
          git -C "${SYNTHXEX_SOURCE_DIR}" apply --check "${patch_file}"
          git -C "${SYNTHXEX_SOURCE_DIR}" apply "${patch_file}"
          git -C "${SYNTHXEX_SOURCE_DIR}" diff --check

          cmake -S "${SYNTHXEX_SOURCE_DIR}" -B "${SYNTHXEX_BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${OPENXECHAIN_ROOT}"
          cmake --build "${SYNTHXEX_BUILD_DIR}" --parallel 2
          cmake --install "${SYNTHXEX_BUILD_DIR}"
          "${OPENXECHAIN_ROOT}/bin/synthxex" --version

      - name: Build Wolf V8A runtime
        run: bash scripts/build-openxechain.sh

      - name: Validate Wolf V8A runtime
        run: |
          output_dir="${GITHUB_WORKSPACE}/build/native-xbox360"
          test -s "${output_dir}/AuroraAZ.xex"
          test -s "${output_dir}/AuroraAZ.xex.sha256"
          python3 - "${output_dir}/AuroraAZ.xex" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          if p.read_bytes()[:4] != b"XEX2":
              raise SystemExit("runtime is not XEX2")
          print(f"validated XEX2: {p} ({p.stat().st_size} bytes)")
          PY
          (cd "${output_dir}" && sha256sum --check AuroraAZ.xex.sha256)

      - name: Stage NetDbgDll probe
        run: |
          mkdir -p build/wolf-v8a-bootstrap-trace
          cp build/native-xbox360/AuroraAZ.xex build/wolf-v8a-bootstrap-trace/NetDbgDll.xex
          (cd build/wolf-v8a-bootstrap-trace && sha256sum NetDbgDll.xex > NetDbgDll.xex.sha256)

      - name: Upload Wolf V8A bootstrap trace probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wolf-V8A-bootstrap-trace-${{ github.sha }}
          path: build/wolf-v8a-bootstrap-trace/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
