name: Wolf V8G settings-independent native create probe

on:
  pull_request:
  push:
    branches:
      - wolf-v8g-create-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OPENXECHAIN_BUILDSCRIPT_COMMIT: eed1fa65bf9577fd31625764b320a90182ea9ade
      OPENXECHAIN_LLVM_COMMIT: 890b83f6c8259a8899e182a5f7d9cf39c64131cc
      OPENXECHAIN_NEWLIB_COMMIT: f929633c27099d404e9cb5b2739a9c7f9b6afccc
      OPENXECHAIN_ROOT: /home/runner/work/_temp/openxechain-prefix
      OPENXECHAIN_CACHE_KEY: openxechain-linux-x64-v2-eed1fa65bf9577fd31625764b320a90182ea9ade
      OPENXECHAIN_SYNTHXEX_COMMIT: 48d1453a55468aa2f8a211db0b20edd594ef5be3
      OPENXECHAIN_XECORELIB_COMMIT: c65d67e071357acade681f04c46ae9719797f239
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test Wolf scripts
        run: |
          cc -std=c99 -Wall -Wextra -Wconversion -Werror -Wpedantic \
            -Inative/include \
            native/tests/wolf_idle_timer_tests.c \
            native/src/wolf_idle_timer.c \
            -o /tmp/wolf_idle_timer_tests
          /tmp/wolf_idle_timer_tests
          python3 -m py_compile scripts/apply-wolf-v8e-xui-resolver.py
          python3 -m py_compile scripts/apply-wolf-v8f-native-scene.py
          python3 -m py_compile scripts/apply-wolf-v8g-create-probe.py
          python3 -m py_compile scripts/apply-wolf-v8i-render-dispatch.py
          python3 -m py_compile scripts/apply-wolf-v8p-direct-xui-overlay.py
          python3 -m py_compile scripts/apply-wolf-v8q-final-render-probe.py
          python3 -m py_compile scripts/apply-wolf-final-idle-key.py
          python3 -m py_compile scripts/apply-wolf-idle-4s-repeat.py

      - name: Apply Wolf V8A module lookup patch
        run: |
          git apply --check scripts/wolf-v8a-module-lookup.patch
          git apply scripts/wolf-v8a-module-lookup.patch
          git diff --check

      - name: Admit only the known AuroraFixer ordinal-1 redirect
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gate = Path('native/src/rev1655_hook_gate.c')
          text = gate.read_text()
          old = (
              '        if (!thunk_matches_target(thunk, expected_target)) {\n'
              '            return AZ_REV1655_HOOK_GATE_BAD_IMPORT_THUNK;\n'
              '        }'
          )
          new = (
              '        if (!thunk_matches_target(thunk, expected_target)) {\n'
              '            const uint8_t aurorafixer_ordinal1_redirect =\n'
              '                thunk_index == 237u &&\n'
              '                library == AZ_REV1655_IMPORT_LIBRARY_XBOXKRNL &&\n'
              '                ordinal == 0x0001u &&\n'
              '                read_u32_be(thunk) == 0x3D608801u &&\n'
              '                read_u32_be(thunk + 4u) == 0x396B02F8u &&\n'
              '                read_u32_be(thunk + 8u) == 0x7D6903A6u &&\n'
              '                read_u32_be(thunk + 12u) == 0x4E800420u;\n'
              '\n'
              '            if (aurorafixer_ordinal1_redirect == 0u) {\n'
              '                return AZ_REV1655_HOOK_GATE_BAD_IMPORT_THUNK;\n'
              '            }\n'
              '        }'
          )
          if old not in text:
              raise SystemExit('hook-gate compatibility anchor missing')
          gate.write_text(text.replace(old, new, 1))

          bootstrap = Path('native/src/netdbg_bootstrap.c')
          text = bootstrap.read_text()
          replacements = [
              (
                  '#define AZ_M2A_MARKER_WORKER_ENTERED 1u\n'
                  '#define AZ_M2A_MARKER_RUNTIME_RETURNED 2u\n'
                  '#define AZ_M2A_RESULT_NOT_ATTEMPTED 0xFFFFFFFFu',
                  '#define AZ_M2A_MARKER_BOOTSTRAP_ENTERED 0u\n'
                  '#define AZ_M2A_MARKER_WORKER_ENTERED 1u\n'
                  '#define AZ_M2A_MARKER_RUNTIME_RETURNED 2u\n'
                  '#define AZ_M2A_MARKER_PIN_RETURNED 3u\n'
                  '#define AZ_M2A_MARKER_THREAD_CREATE_RETURNED 4u\n'
                  '#define AZ_M2A_RESULT_NOT_ATTEMPTED 0xFFFFFFFFu'
              ),
              (
                  '            __ATOMIC_ACQUIRE)) {\n'
                  '        return 0u;\n'
                  '    }\n\n'
                  '    /* Close the only unload window',
                  '            __ATOMIC_ACQUIRE)) {\n'
                  '        return 0u;\n'
                  '    }\n\n'
                  '    write_m2a_marker(\n'
                  '        AZ_M2A_MARKER_BOOTSTRAP_ENTERED,\n'
                  '        AZ_M2A_RESULT_NOT_ATTEMPTED);\n\n'
                  '    /* Close the only unload window'
              ),
              (
                  '    pin_result = az_rev1655_runtime_pin_module(\n'
                  '        (uint32_t)(uintptr_t)&AuroraAZNetDbgWrite);\n'
                  '    if (pin_result != AZ_REV1655_RUNTIME_OK) {',
                  '    pin_result = az_rev1655_runtime_pin_module(\n'
                  '        (uint32_t)(uintptr_t)&AuroraAZNetDbgWrite);\n'
                  '    write_m2a_marker(\n'
                  '        AZ_M2A_MARKER_PIN_RETURNED,\n'
                  '        (uint32_t)pin_result);\n'
                  '    if (pin_result != AZ_REV1655_RUNTIME_OK) {'
              ),
              (
                  '    create_result = az_rev1655_thread_create(\n'
                  '        (void *)(uintptr_t)&bootstrap_rev1655_runtime,\n'
                  '        NULL,\n'
                  '        &thread);\n'
                  '    if (create_result ==',
                  '    create_result = az_rev1655_thread_create(\n'
                  '        (void *)(uintptr_t)&bootstrap_rev1655_runtime,\n'
                  '        NULL,\n'
                  '        &thread);\n'
                  '    write_m2a_marker(\n'
                  '        AZ_M2A_MARKER_THREAD_CREATE_RETURNED,\n'
                  '        (uint32_t)create_result);\n'
                  '    if (create_result =='
              ),
              (
                  '        3u,\n        (uint32_t)sizeof(AzM2aMarker),',
                  '        6u,\n        (uint32_t)sizeof(AzM2aMarker),'
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'bootstrap compatibility anchor missing: {old[:80]!r}')
              text = text.replace(old, new, 1)
          bootstrap.write_text(text)
          PY
          git diff --check

      - name: Apply Wolf V8B idle timer integration
        run: |
          python3 scripts/apply-wolf-v8b-integration.py
          git diff --check

      - name: Apply Wolf V8E XUI resolver integration
        run: |
          python3 scripts/apply-wolf-v8e-xui-resolver.py
          grep -q 'WolfFactory-V8E-xui.bin' native/src/rev1655_runtime.c
          git diff --check

      - name: Apply Wolf V8F native scene base
        run: |
          python3 scripts/apply-wolf-v8f-native-scene.py
          grep -q 'WolfFactory-V8F-scene.bin' native/src/rev1655_runtime.c
          git diff --check

      - name: Apply Wolf V8G settings-independent create probe
        run: |
          python3 scripts/apply-wolf-v8g-create-probe.py
          grep -q 'WolfFactory-V8G-create.bin' native/src/rev1655_runtime.c
          grep -q '0xFFFFFFFEu' native/src/rev1655_runtime.c
          grep -q 'wolf_v8f_try_native_scene(0u)' native/src/rev1655_runtime.c
          git diff --check

      - name: Apply Wolf V8I render-thread dispatch
        run: |
          python3 scripts/apply-wolf-v8i-render-dispatch.py
          grep -q 'wolf_v8i_render_ui_tick' native/src/rev1655_runtime.c
          grep -q 'wolf_v8i_render_ui_tick' native/src/render_detours.c
          grep -q 'WolfFactory-FINAL-idle-key.bin' native/src/rev1655_runtime.c
          grep -q 'WolfFactory FINAL: 4-second repeat armed' native/src/rev1655_runtime.c
          git diff --check

      - name: Restore pinned OpenXeChain toolchain
        id: toolchain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.OPENXECHAIN_ROOT }}
          key: ${{ env.OPENXECHAIN_CACHE_KEY }}

      - name: Reclaim disk space for toolchain fallback
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf -- \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache
          df -h /

      - name: Install host build dependencies for toolchain fallback
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bash binutils build-essential bzip2 ca-certificates clang cmake \
            findutils gawk git gzip make ninja-build python3 python3-yaml \
            sed tar unzip zip zlib1g-dev zstd

      - name: Fetch pinned OpenXeChain sources on cache miss
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          SOURCE_DIR: /home/runner/work/_temp/openxechain-source
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --filter=blob:none --no-checkout \
            https://github.com/OpenXeChain/buildscript.git "${SOURCE_DIR}"
          git -C "${SOURCE_DIR}" checkout --detach "${OPENXECHAIN_BUILDSCRIPT_COMMIT}"
          git -C "${SOURCE_DIR}" submodule sync --recursive
          git -C "${SOURCE_DIR}" submodule update --init --recursive --depth 1 --jobs 4
          test "$(git -C "${SOURCE_DIR}" rev-parse HEAD)" = "${OPENXECHAIN_BUILDSCRIPT_COMMIT}"
          test "$(git -C "${SOURCE_DIR}/llvm" rev-parse HEAD)" = "${OPENXECHAIN_LLVM_COMMIT}"
          test "$(git -C "${SOURCE_DIR}/newlib" rev-parse HEAD)" = "${OPENXECHAIN_NEWLIB_COMMIT}"
          test "$(git -C "${SOURCE_DIR}/synthxex" rev-parse HEAD)" = "${OPENXECHAIN_SYNTHXEX_COMMIT}"
          test "$(git -C "${SOURCE_DIR}/xecorelib" rev-parse HEAD)" = "${OPENXECHAIN_XECORELIB_COMMIT}"

      - name: Apply pinned Newlib preprocessor fix on cache miss
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          SOURCE_DIR: /home/runner/work/_temp/openxechain-source
        run: |
          patch_file="${GITHUB_WORKSPACE}/scripts/openxechain-newlib-cpp.patch"
          git -C "${SOURCE_DIR}" apply --check "${patch_file}"
          git -C "${SOURCE_DIR}" apply "${patch_file}"
          git -C "${SOURCE_DIR}" diff --check

      - name: Build pinned OpenXeChain toolchain on cache miss
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          PREFIX: /home/runner/work/_temp/openxechain-prefix
          SOURCE_DIR: /home/runner/work/_temp/openxechain-source
          PARALLEL: 4
          BUILD_TYPE: Release
          HOST_CC: clang
          HOST_CXX: clang++
        run: |
          cd "${SOURCE_DIR}"
          ./build-toolchain.sh

      - name: Verify OpenXeChain tools
        run: |
          test -x "${OPENXECHAIN_ROOT}/bin/clang"
          test -x "${OPENXECHAIN_ROOT}/bin/lld-link"
          test -x "${OPENXECHAIN_ROOT}/bin/synthxex"
          "${OPENXECHAIN_ROOT}/bin/clang" --version

      - name: Save pinned OpenXeChain toolchain after fallback
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.OPENXECHAIN_ROOT }}
          key: ${{ env.OPENXECHAIN_CACHE_KEY }}

      - name: Build patched SynthXEX
        env:
          SYNTHXEX_SOURCE_DIR: /home/runner/work/_temp/wolf-v8g-synthxex-source
          SYNTHXEX_BUILD_DIR: /home/runner/work/_temp/wolf-v8g-synthxex-build
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/OpenXeChain/SynthXEX.git "${SYNTHXEX_SOURCE_DIR}"
          git -C "${SYNTHXEX_SOURCE_DIR}" checkout --detach "${OPENXECHAIN_SYNTHXEX_COMMIT}"
          patch_file="${GITHUB_WORKSPACE}/scripts/openxechain-synthxex-image-base.patch"
          git -C "${SYNTHXEX_SOURCE_DIR}" apply --check "${patch_file}"
          git -C "${SYNTHXEX_SOURCE_DIR}" apply "${patch_file}"
          cmake -S "${SYNTHXEX_SOURCE_DIR}" -B "${SYNTHXEX_BUILD_DIR}" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${OPENXECHAIN_ROOT}"
          cmake --build "${SYNTHXEX_BUILD_DIR}" --parallel 2
          cmake --install "${SYNTHXEX_BUILD_DIR}"

      - name: Build Wolf runtime
        run: bash scripts/build-openxechain.sh

      - name: Validate WolfIdle 12s/4s runtime
        run: |
          output_dir="${GITHUB_WORKSPACE}/build/native-xbox360"
          test -s "${output_dir}/AuroraAZ.xex"
          test -s "${output_dir}/AuroraAZ.xex.sha256"
          python3 - "${output_dir}/AuroraAZ.xex" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          data = p.read_bytes()
          if data[:4] != b'XEX2':
              raise SystemExit('runtime is not XEX2')
          for needle in (
              b'WolfFactory-V8B-idle.bin',
              b'WolfFactory-FINAL-idle-key.bin',
              b'WolfFactory FINAL: 4-second repeat armed',
              b'AuroraAZ_Settings.xur',
              b'xam.xex',
          ):
              if needle not in data:
                  raise SystemExit(f'missing expected WolfIdle string: {needle!r}')
          print(f'validated WolfIdle 12s/4s XEX2: {p} ({p.stat().st_size} bytes)')
          PY
          (cd "${output_dir}" && sha256sum --check AuroraAZ.xex.sha256)

      - name: Stage WolfIdle 12s/4s build
        run: |
          mkdir -p build/wolf-idle-4s
          cp build/native-xbox360/AuroraAZ.xex build/wolf-idle-4s/NetDbgDll.xex
          (cd build/wolf-idle-4s && sha256sum NetDbgDll.xex > NetDbgDll.xex.sha256)

      - name: Upload WolfIdle 12s/4s build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WolfIdle4s-${{ github.sha }}
          path: build/wolf-idle-4s/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
